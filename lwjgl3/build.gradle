plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'app.ArconteLauncher'
    applicationName = 'Arconte'
}

// El mapa (assets/Polis.png) va dentro del jar: así la carpeta generada por installDist
// funciona en cualquier computador sin copiar la carpeta assets aparte.
sourceSets {
    main {
        resources {
            srcDir '../assets'
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
}

run {
    workingDir = rootProject.file('assets')
}
